version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chigir-ale-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chigir_ale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chigir_ale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chigir-ale-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chigir-ale-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/chigir_ale?schema=public"
      AUTH_SECRET: "development-auth-secret-min-32-chars-long"
      APP_URL: "http://localhost:3000"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
